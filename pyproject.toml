[project]
name = "geoagent"
version = "0.1.0"
description = "Supervisor-driven multi-agent reconstruction of geometry figures as compilable LaTeX/TikZ"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "Pillow",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "openai",
    "python-dotenv",
    "PyMuPDF",
    "scikit-image",
    "pydantic>=2.6",
    "streamlit>=1.40",
    "pandas>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
